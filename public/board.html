<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>notiBridge Board</title>
<style>
  :root { --bg:#f6f7f9; --col:#eceef2; --card:#fff; --text:#1d2129; --dim:#6b7280; --border:#d9dde3;
          --issue:#d93f3f; --task:#2f6fdb; --feature:#1f9d63; --high:#d93f3f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --col:#1c1f24; --card:#24282e; --text:#e6e8eb; --dim:#9aa1ab; --border:#33383f;
            --issue:#f06a6a; --task:#6a9bf0; --feature:#4cc38a; --high:#f06a6a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; gap:12px; align-items:center; padding:12px 16px; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; margin-right:auto; }
  .filters button { border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:999px; padding:4px 12px; cursor:pointer; }
  .filters button[aria-pressed="true"] { background:var(--text); color:var(--bg); }
  main { display:grid; grid-template-columns:repeat(3, minmax(260px, 1fr)); gap:12px; padding:0 16px 16px; overflow-x:auto; }
  @media (max-width: 820px) { main { grid-template-columns:1fr; } }
  section { background:var(--col); border-radius:10px; padding:10px; min-height:200px; }
  section.over { outline:2px dashed var(--dim); }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); margin:4px 4px 10px; }
  article { background:var(--card); border:1px solid var(--border); border-left:4px solid var(--k); border-radius:8px; padding:8px 10px; margin-bottom:8px; cursor:grab; }
  article[data-kind="issue"] { --k:var(--issue); } article[data-kind="task"] { --k:var(--task); } article[data-kind="feature"] { --k:var(--feature); }
  .meta { display:flex; gap:6px; flex-wrap:wrap; font-size:12px; color:var(--dim); margin-top:4px; }
  .kind { color:var(--k); font-weight:600; text-transform:uppercase; font-size:11px; }
  .high { color:var(--high); font-weight:600; }
  details { font-size:12px; color:var(--dim); margin-top:4px; } details p { white-space:pre-wrap; margin:4px 0; }
  a { color:inherit; }
</style>
</head>
<body>
<header>
  <h1>notiBridge</h1>
  <div class="filters" role="group" aria-label="Filter by kind">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="issue" aria-pressed="false">Issues</button>
    <button data-f="task" aria-pressed="false">Tasks</button>
    <button data-f="feature" aria-pressed="false">Features</button>
  </div>
</header>
<main>
  <section data-status="todo"><h2>To do</h2><div></div></section>
  <section data-status="doing"><h2>In progress</h2><div></div></section>
  <section data-status="done"><h2>Done</h2><div></div></section>
</main>
<script>
let filter = 'all', cards = []
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]))
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 60 ? `${m}m` : m < 1440 ? `${Math.round(m/60)}h` : `${Math.round(m/1440)}d` }

function render() {
  for (const sec of document.querySelectorAll('section')) {
    const list = cards.filter(c => c.status === sec.dataset.status && (filter === 'all' || c.kind === filter))
    sec.querySelector('h2').textContent = `${sec.querySelector('h2').textContent.replace(/ \(\d+\)$/, '')} (${list.length})`
    sec.querySelector('div').innerHTML = list.map(c => `
      <article draggable="true" data-id="${c.id}" data-kind="${esc(c.kind)}">
        <div><span class="kind">${esc(c.kind)}</span> #${c.id} ${esc(c.title)}</div>
        <div class="meta">
          <span class="${c.priority === 'high' ? 'high' : ''}">${esc(c.priority)}</span>
          <span>${esc(c.source)}</span>${c.author ? `<span>${esc(c.author)}</span>` : ''}
          ${c.agent ? `<span>agent: ${esc(c.agent)}</span>` : ''}<span>${ago(c.created_at)}</span>
          ${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">open</a>` : ''}
        </div>
        <details><summary>message</summary><p>${esc(c.body)}</p>${c.note ? `<p><b>note:</b> ${esc(c.note)}</p>` : ''}</details>
      </article>`).join('')
  }
}

async function load() {
  try { cards = await (await fetch('/api/cards')).json(); render() } catch {}
}

document.querySelector('.filters').addEventListener('click', e => {
  const f = e.target.dataset?.f; if (!f) return
  filter = f
  for (const b of document.querySelectorAll('.filters button')) b.setAttribute('aria-pressed', b.dataset.f === f)
  render()
})
document.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', e.target.dataset.id))
for (const sec of document.querySelectorAll('section')) {
  sec.addEventListener('dragover', e => { e.preventDefault(); sec.classList.add('over') })
  sec.addEventListener('dragleave', () => sec.classList.remove('over'))
  sec.addEventListener('drop', async e => {
    e.preventDefault(); sec.classList.remove('over')
    const id = e.dataTransfer.getData('text/plain')
    await fetch(`/api/cards/${id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ status: sec.dataset.status }) })
    load()
  })
}
load(); setInterval(load, 5000)
</script>
</body>
</html>
